[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["api-bindings", "os::windows-apis"]
description = "cross-os crate that helps you write files faster. it pre-allocate in memory mapped file instead of disk, then parallel write it."
documentation = "https://docs.rs/mmap_alloc"
edition = "2024"
include = ["src/**/*.rs", "README.md", "LICENSE.MIT"]
keywords = ["windows", "linux", "disk", "mmap", "allocate"]
license = "MIT"
name = "mmap_alloc"
readme = "README.md"
repository = "https://github.com/eladkarako/mmap_alloc"
rust-version = "1.93.0"
version = "26.10.19"
[dependencies]
anyhow = { version = "1.0.104" }
num_cpus = { version = "1.16" }
libc = "1.0.0-alpha.5"
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", default-features = false, features = ["fileapi", "memoryapi", "handleapi", "winnt"] }
[dev-dependencies]
tempfile = { version = "3.0" }
[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = 2
panic = "abort"
rpath = false
strip = true
[[example]]
name = "example_write"
path = "examples/example_write.rs"
[[example]]
name = "example_large_file"
path = "examples/example_large_file.rs"
[[example]]
name = "example_custom_partitions"
path = "examples/example_custom_partitions.rs"
[lib]
name = "mmap_alloc"
path = "src/lib.rs"
[lints.rust]
missing_docs = "allow"

